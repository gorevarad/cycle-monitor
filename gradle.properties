# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Configure-on-demand lets `:core:test` run without configuring the :app module
# (and therefore without needing the Android SDK installed) in environments
# that only have a JVM toolchain available, such as CI containers without
# Android SDK components.
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
